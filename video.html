<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v8 - Reproductor TV</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }
  </style>
</head>

<body>

  <video id="video" controls playsinline preload="auto"></video>

  <script>
    var video = document.getElementById("video");

    // Lee el ID de la propia dirección de la página
    var direccion = window.location.href;
    var idVideo = "";

    var posicion = direccion.indexOf("?id=");

    if (posicion !== -1) {
      idVideo = direccion.substring(posicion + 4);

      // Por si en el futuro hubiera más parámetros
      var ampersand = idVideo.indexOf("&");
      if (ampersand !== -1) {
        idVideo = idVideo.substring(0, ampersand);
      }
    }

    // Construye la dirección de Google Drive
    if (idVideo !== "") {

      video.src =
        "https://drive.google.com/uc?export=download&id=" + idVideo;

      video.load();
    }

    // Repetición del vídeo
    video.addEventListener("ended", function() {

      video.load();

      video.addEventListener("canplay", function iniciar() {

        video.removeEventListener("canplay", iniciar);

        video.play().catch(function(error) {
          console.log("No se pudo reiniciar automáticamente");
        });

      });

    });
  </script>

</body>
</html>
