<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeo en Bucle con Audio</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: sans-serif;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    /* Capa de inicio para dar el primer clic en la Smart TV si bloquea el autoplay con audio */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
    }

    #btn-iniciar {
      background: #007bff;
      color: white;
      font-size: 2rem;
      padding: 20px 40px;
      border: none;
      border-radius: 10px;
      outline: none;
    }
  </style>
</head>

<body>

  <div id="overlay">
    <button id="btn-iniciar">▶ Pulsar para iniciar vídeo con audio</button>
  </div>

  <video id="video" loop controls playsinline preload="auto">
    <source
      src="https://drive.google.com/uc?export=download&id=1Dl839jkSHgQhjMMLXYChJzKT44FF7EMm"
      type="video/mp4">
    Tu navegador no puede reproducir este vídeo.
  </video>

  <script>
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const btnIniciar = document.getElementById("btn-iniciar");

    function arrancarVideo() {
      video.muted = false; // Nos aseguramos de habilitar el sonido
      
      video.play().then(function() {
        // Si el navegador permite reproducir, ocultamos la pantalla de inicio
        overlay.style.display = "none";
      }).catch(function(error) {
        console.log("Autoplay bloqueado por políticas de audio del navegador:", error);
      });
    }

    // 1. Intentar iniciar al cargar la página
    window.addEventListener("DOMContentLoaded", function() {
      arrancarVideo();
    });

    // 2. Si la TV bloqueó el audio automático, la primera pulsación en la pantalla otorgará el permiso
    overlay.addEventListener("click", function() {
      arrancarVideo();
    });

    // 3. Respaldo por JavaScript para navegadores de TV que ignoran el atributo "loop"
    video.addEventListener("ended", function() {
      video.currentTime = 0;
      video.play().catch(function(err) {
        console.log("Error reanudando bucle:", err);
      });
    });
  </script>

</body>
</html>
