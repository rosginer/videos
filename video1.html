<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v6 - Vídeo 1</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }
  </style>
</head>

<body>

  <video id="video" controls playsinline preload="auto">
    <source
      src="https://drive.google.com/uc?export=download&id=1Dl839jkSHgQhjMMLXYChJzKT44FF7EMm"
      type="video/mp4">
  </video>

  <script>
    const video = document.getElementById("video");

    video.addEventListener("ended", function() {

      // Volvemos inmediatamente al principio para que pueda cargarlo
      video.currentTime = 0;

      // Esperamos 8 segundos antes de iniciar la siguiente reproducción
      setTimeout(function() {

        video.play().catch(function(error) {
          console.log("No se pudo reiniciar automáticamente:", error);
        });

      }, 8000);

    });
  </script>

</body>
</html>
