<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeo 1</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #contenedor {
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }
  </style>
</head>

<body>

  <div id="contenedor"></div>

  <script>
    const urlVideo =
      "https://drive.google.com/uc?export=download&id=1Dl839jkSHgQhjMMLXYChJzKT44FF7EMm";

    function crearVideo() {

      const contenedor = document.getElementById("contenedor");

      contenedor.innerHTML = "";

      const video = document.createElement("video");

      video.src = urlVideo;
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;

      contenedor.appendChild(video);

      video.addEventListener("ended", function() {
        crearVideo();
      });
    }

    crearVideo();
  </script>

</body>
</html>
