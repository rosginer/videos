<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IES Fco. Ros Giner - Vídeo Hall</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      display: block;
    }

    /* Cortinilla de pausa entre reproducciones */
    #cortinilla {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: none; /* Oculta por defecto */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      z-index: 10;
    }

    /* Nombre del instituto */
    #cortinilla h1 {
      font-size: 3.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 0 0 15px 0;
      color: #ffffff;
    }

    /* Subtítulo debajo del instituto */
    #cortinilla p {
      font-size: 1.6rem;
      color: #bbbbbb;
      margin: 0;
      font-weight: 300;
    }
  </style>
</head>

<body>

  <!-- Cortinilla personalizada con el texto del centro -->
  <div id="cortinilla">
    <h1>IES Fco. Ros Giner</h1>
    <p>- Iniciando vídeo... -</p>
  </div>

  <!-- Reproductor de vídeo -->
  <video id="video" controls playsinline preload="auto">
    <source
      src="https://drive.google.com/uc?export=download&id=1Dl839jkSHgQhjMMLXYChJzKT44FF7EMm"
      type="video/mp4">
    Tu navegador no puede reproducir este vídeo.
  </video>

  <script>
    const video = document.getElementById("video");
    const cortinilla = document.getElementById("cortinilla");

    // Tiempo de pausa en milisegundos (5000 ms = 5 segundos de margen para cargar el búfer de Drive)
    const TIEMPO_PAUSA = 5000;

    video.addEventListener("ended", function() {
      // 1. Mostrar pantalla del instituto y ocultar reproductor
      video.style.display = "none";
      cortinilla.style.display = "flex";

      // 2. Rebobinar y forzar la recarga previa en memoria durante la pausa
      video.currentTime = 0;
      video.load();

      // 3. Esperar 5 segundos y reiniciar el vídeo con audio
      setTimeout(function() {
        video.play().then(function() {
          cortinilla.style.display = "none";
          video.style.display = "block";
        }).catch(function(error) {
          console.log("Error al reanudar vídeo:", error);
        });
      }, TIEMPO_PAUSA);
    });
  </script>

</body>
</html>
