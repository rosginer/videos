<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IES Fco. Ros Giner - Vídeo Hall</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Oculto por defecto durante la carga inicial */
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      display: none; 
    }

    /* Pantalla intermedia de texto */
    #cortinilla {
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    #cortinilla h1 {
      font-size: 3.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 0 0 15px 0;
      color: #ffffff;
    }

    #cortinilla p {
      font-size: 1.6rem;
      color: #bbbbbb;
      margin: 0;
      font-weight: 300;
    }
  </style>
</head>

<body>

  <!-- Mensaje de pausa -->
  <div id="cortinilla">
    <h1>IES Fco. Ros Giner</h1>
    <p>- Iniciando vídeo... -</p>
  </div>

  <!-- Reproductor de vídeo -->
  <video id="video" controls playsinline preload="auto">
    <source
      src="https://drive.google.com/uc?export=download&id=1Dl839jkSHgQhjMMLXYChJzKT44FF7EMm"
      type="video/mp4">
    Tu navegador no puede reproducir este vídeo.
  </video>

  <script>
    const video = document.getElementById("video");
    const cortinilla = document.getElementById("cortinilla");

    const TIEMPO_PAUSA = 5000; // 5 segundos de espera
    let bucleActivo = false;

    // Al pulsar PLAY la primera vez al encender la TV
    video.addEventListener("play", function() {
      cortinilla.style.display = "none";
      video.style.display = "block";
    });

    // Detectar cuando el vídeo termina
    video.addEventListener("ended", ejecutarBucle);

    function ejecutarBucle() {
      if (bucleActivo) return;
      bucleActivo = true;

      // 1. Ocultar vídeo y mostrar el texto del centro
      video.style.display = "none";
      cortinilla.style.display = "flex";

      // 2. Rebobinar a cero
      video.currentTime = 0;

      // 3. Esperar 5 segundos a que cargue el búfer de Drive
      setTimeout(function() {
        // Intentar reproducción
        const promesa = video.play();

        if (promesa !== undefined) {
          promesa.then(function() {
            // Forzar con pequeño retardo para asegurar que el procesador gráfico de la TV antigua ha arrancado la imagen
            setTimeout(function() {
              cortinilla.style.display = "none";
              video.style.display = "block";
              bucleActivo = false;
            }, 300);
          }).catch(function(err) {
            console.log("Error de reproducción:", err);
            // Respaldo en caso de bloqueo por el navegador
            cortinilla.style.display = "none";
            video.style.display = "block";
            bucleActivo = false;
          });
        }
      }, TIEMPO_PAUSA);
    }
  </script>

</body>
</html>
