<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeo Bucle Continuo</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }
  </style>
</head>

<body>

  <video id="video" loop controls playsinline preload="auto">
    <source
      src="https://drive.google.com/uc?export=download&id=1Dl839jkSHgQhjMMLXYChJzKT44FF7EMm"
      type="video/mp4">
    Tu navegador no puede reproducir este vídeo.
  </video>

  <script>
    const video = document.getElementById("video");

    // Prevenir el congelamiento descargando en búfer por anticipado
    // Cuando falten 0.3 segundos para terminar, rebobinamos a 0.1s para evitar que el reproductor pierda el búfer en RAM
    video.addEventListener("timeupdate", function() {
      if (video.duration && video.currentTime >= video.duration - 0.3) {
        video.currentTime = 0.1;
        video.play();
      }
    });

    // Respaldo habitual por si la TV no dispara el event timeupdate a tiempo
    video.addEventListener("ended", function() {
      video.currentTime = 0.1;
      video.play();
    });

    // Iniciar con audio en cuanto el usuario presione play la primera vez
    video.addEventListener("play", function() {
      video.muted = false;
    });
  </script>

</body>
</html>
