<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IES Fco. Ros Giner - Vídeo Hall</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      display: block;
    }

    /* Cortinilla de transición */
    #cortinilla {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      z-index: 10;
      
      /* Transición suave y control de visibilidad */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* Clase para mostrar la cortinilla */
    #cortinilla.activa {
      opacity: 1;
      pointer-events: auto;
    }

    #cortinilla h1 {
      font-size: 3.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 0 0 15px 0;
      color: #ffffff;
    }

    #cortinilla p {
      font-size: 1.6rem;
      color: #bbbbbb;
      margin: 0;
      font-weight: 300;
    }
  </style>
</head>

<body>

  <div id="cortinilla">
    <h1>IES Fco. Ros Giner</h1>
    <p>- Iniciando vídeo... -</p>
  </div>

  <video id="video" controls playsinline preload="auto">
    <source
      src="https://drive.google.com/uc?export=download&id=1Dl839jkSHgQhjMMLXYChJzKT44FF7EMm"
      type="video/mp4">
    Tu navegador no puede reproducir este vídeo.
  </video>

  <script>
    const video = document.getElementById("video");
    const cortinilla = document.getElementById("cortinilla");

    const TIEMPO_PAUSA = 5000; // 5 segundos de cortinilla
    let enPausa = false;

    // Al terminar el vídeo
    video.addEventListener("ended", function() {
      enPausa = true;
      
      // 1. Mostrar la cortinilla inmediatamente
      cortinilla.classList.add("activa");

      // 2. Rebobinar
      video.currentTime = 0;

      // 3. Tras 5 segundos, dar a reproducir
      setTimeout(function() {
        video.play().catch(function(error) {
          console.log("Error al reproducir:", error);
        });
      }, TIEMPO_PAUSA);
    });

    // Detectar el avance real de la reproducción para retirar la cortinilla
    video.addEventListener("timeupdate", function() {
      // Si estaba en pausa y el vídeo ya ha empezado a avanzar (segundo > 0)
      if (enPausa && video.currentTime > 0) {
        cortinilla.classList.remove("activa");
        enPausa = false;
      }
    });
  </script>

</body>
</html>
